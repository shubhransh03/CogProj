# CogProj Master Configuration Profile
# Phase 4: Camera Pipeline, Detection, Tracking, Counting, and Visualization

camera_input_node:
  ros__parameters:
    input_topic: "/pi_camera/image_raw"
    output_topic: "/cogproj/image_raw"

detection_node:
  ros__parameters:
    # Master switch: disabled by default (safe state)
    enabled: false
    test_mode: false
    image_topic: "/cogproj/image_raw"
    detection_topic: "/cogproj/detections"
    # Real ONNX model plugin path (e.g. /home/veerobot/CogProj/models/ore_yolo)
    # Model classes: 0: "resource", 1: "host_rock"
    model_directory: ""
    model_plugin_path: ""
    model_config_path: ""
    confidence_threshold: 0.60
    # NMS threshold is configured within model adapter config.yaml (default: 0.40)

tracking_node:
  ros__parameters:
    input_topic: "/cogproj/detections"
    output_topic: "/cogproj/tracked_ores"
    max_centroid_distance_px: 50.0
    min_iou: 0.10
    max_missed_frames: 5
    min_confirmed_hits: 3
    use_odom: false
    odom_topic: "/odometry/filtered"

counting_node:
  ros__parameters:
    input_topic: "/cogproj/tracked_ores"
    output_topic: "/cogproj/counts_summary"
    counting_enabled: true

visualizer_node:
  ros__parameters:
    image_topic: "/cogproj/image_raw"
    detection_topic: "/cogproj/detections"
    tracking_topic: "/cogproj/tracked_ores"
    count_topic: "/cogproj/counts_summary"
    annotated_topic: "/cogproj/image_annotated"
    compressed_topic: "/cogproj/image_annotated/compressed"
    camera_timeout_sec: 2.0
    detection_timeout_sec: 2.0
    tracking_timeout_sec: 2.0
    count_timeout_sec: 5.0
    jpeg_quality: 80

spatial_association_node:
  ros__parameters:
    tracked_topic: "/cogproj/tracked_ores"
    camera_info_topic: "/camera/camera_info"
    scan_topic: "/scan"
    output_spatial_topic: "/cogproj/spatial_ores"
    output_marker_topic: "/cogproj/spatial_markers"
    target_frame: "map"
    base_frame: "base_footprint"
    camera_optical_frame: "camera_optical_link"
    lidar_frame: "lidar_link"
    max_timestamp_skew_sec: 0.50
    min_range: 0.10
    max_range: 12.0
    cluster_tolerance_m: 0.35
    marker_lifetime_sec: 2.0
